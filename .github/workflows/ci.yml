name: CI

# Lean PR gate: the entrypoint guard (sub-second) plus the unit/integration
# suite.  The heavy tiers (gauntlet, scenario, live-week, compose) stay in the
# local full gate (./tools/run_all.sh) so PR feedback is fast; see AGENTS.md
# section 4.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches the production Dockerfile
          cache: pip

      - name: Install dev extras
        run: pip install -r requirements-dev.txt

      # Invoked as "./tools/run_all.sh" on purpose: exercising the documented
      # entrypoint is itself part of the contract under test.
      - name: Entrypoint guard + unit/integration suite
        run: ./tools/run_all.sh --fast

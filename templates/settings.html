{% extends "base.html" %}
{% block content %}
<h1 class="page-title">General Settings</h1>
<div style="display:grid; gap:18px; max-width:760px; margin-top:18px">
  <section class="card">
    <h2 style="margin-top:4px">Account details</h2>
    <form method="post" action="{{ url_for('settings') }}" style="display:grid; gap:10px">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="profile">
      <label for="account-name">Display name</label>
      <input id="account-name" name="name" value="{{ user.name }}" autocomplete="name" required>
      <label for="account-username">Username</label>
      <input id="account-username" name="username" value="{{ user.username }}" autocomplete="username" required>
      <label for="account-email">Email</label>
      <input id="account-email" name="email" type="email" value="{{ user.email or '' }}" autocomplete="email">
      <button class="btn" type="submit">Save account details</button>
    </form>
  </section>

  <section class="card">
    <h2 style="margin-top:4px">Clock format</h2>
    <p class="muted">Choose how shift start and end times appear throughout your schedule.</p>
    <form method="post" action="{{ url_for('settings') }}" style="display:grid; gap:10px">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="clock">
      <label for="time-format">Time display</label>
      <select id="time-format" name="time_format">
        <option value="12h" {% if time_format == '12h' %}selected{% endif %}>12-hour (1:30 PM)</option>
        <option value="24h" {% if time_format == '24h' %}selected{% endif %}>24-hour (13:30)</option>
      </select>
      <button class="btn" type="submit">Save clock format</button>
    </form>
  </section>

  <section class="card" id="password">
    <h2 style="margin-top:4px">Change password</h2>
    <form method="post" action="{{ url_for('settings') }}" style="display:grid; gap:10px">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="password">
      <label for="current-password">Current password</label>
      <input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
      <label for="new-password">New password (12+ characters)</label>
      <input id="new-password" name="new_password" type="password" minlength="12" autocomplete="new-password" required>
      <button class="btn" type="submit">Save password</button>
    </form>
  </section>
</div>
{% endblock %}

name: CI

# One dependency-free check: the tracked shell entrypoints keep their
# executable bit.  Deliberately tiny -- no python/pytest/docker/venv setup;
# the test suite runs locally via tools/run_all.sh (AGENTS.md section 4).
# This is not a required status check: blocking merges needs branch protection,
# which needs repo admin.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tracked entrypoints stay executable
        run: ./tools/check_entrypoints.py

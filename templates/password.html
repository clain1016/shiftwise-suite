{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Change password</h1>
<div class="login-card" style="margin-top:24px">
  <form method="post" action="{{ url_for('change_password') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="old-password" class="muted" style="display:block; font-size:12px; font-weight:600; text-transform:uppercase; margin-bottom:6px">Current password</label>
    <input id="old-password" name="old_password" type="password" autocomplete="current-password" required style="width:100%; margin-bottom:14px">
    <label for="new-password" class="muted" style="display:block; font-size:12px; font-weight:600; text-transform:uppercase; margin-bottom:6px">New password (12+ characters)</label>
    <input id="new-password" name="new_password" type="password" minlength="12" autocomplete="new-password" required style="width:100%; margin-bottom:18px">
    <button class="btn" style="width:100%">Save password</button>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Change password</h1>
<div class="login-card" style="margin-top:24px">
  <form method="post" action="{{ url_for('change_password') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="old-password">Current password</label>
    <input id="old-password" name="old_password" type="password" autocomplete="current-password" required>
    <label for="new-password">New password (12+ characters)</label>
    <input id="new-password" name="new_password" type="password" minlength="12" autocomplete="new-password" required>
    <button class="btn">Save password</button>
  </form>
</div>
{% endblock %}
